AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: UBBC Bot - Telegram Beer Ordering Bot

Parameters:
  Environment:
    Type: String
    Default: test
    AllowedValues: [test, prod]
  AdminUserId:
    Type: String
    Description: Telegram user ID of the bot administrator

Conditions:
  IsTestEnvironment: !Equals [!Ref Environment, test]

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DYNAMODB_TABLE_PREFIX: !Sub 'ubbc-bot-${Environment}'
        S3_BUCKET_NAME: !Ref ImageBucket
        ADMIN_USER_ID: !Ref AdminUserId
        DEFAULT_GROUP_ID: !If 
          - IsTestEnvironment
          - '-1003399818858'
          - '-1001662432692'

Resources:
  # API Gateway
  BotApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'ubbc-bot-${Environment}-api'
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"
      Tags:
        Project: UBBCBot
        Environment: !Ref Environment
        Owner: siebrand
        CostCenter: personal
        Application: ubbc-telegram-bot
        ManagedBy: sam

  # Lambda Functions
  OffersApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ubbc-bot-${Environment}-offers-api'
      RetentionInDays: 7
      LogGroupClass: STANDARD
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  WebhookHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ubbc-bot-${Environment}-webhook-handler'
      RetentionInDays: 7
      LogGroupClass: STANDARD
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  NotificationSenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ubbc-bot-${Environment}-notification-sender'
      RetentionInDays: 7
      LogGroupClass: STANDARD
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  MessageSenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/ubbc-bot-${Environment}-message-sender'
      RetentionInDays: 7
      LogGroupClass: STANDARD
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  OffersApiHandler:
    Type: AWS::Serverless::Function
    DependsOn: OffersApiLogGroup
    Properties:
      FunctionName: !Sub 'ubbc-bot-${Environment}-offers-api'
      CodeUri: src/
      Handler: handlers.api.offers.handler
      Timeout: 10
      Events:
        GetOffers:
          Type: Api
          Properties:
            RestApiId: !Ref BotApi
            Path: /offers
            Method: get
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource: !GetAtt OffersTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource: !Sub '${BoxesTable.Arn}/index/offer-index'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt CountersTable.Arn
      Tags:
        Project: UBBCBot
        Environment: !Ref Environment
        Owner: siebrand
        CostCenter: personal
        Application: ubbc-telegram-bot
        ManagedBy: sam

  WebhookHandler:
    Type: AWS::Serverless::Function
    DependsOn: WebhookHandlerLogGroup
    Properties:
      FunctionName: !Sub 'ubbc-bot-${Environment}-webhook-handler'
      CodeUri: src/
      Handler: handlers.webhook.handler
      Environment:
        Variables:
          NOTIFICATION_LAMBDA_NAME: !Ref NotificationSender
          MESSAGE_SENDER_LAMBDA_NAME: !Ref MessageSender
      Events:
        WebhookApi:
          Type: Api
          Properties:
            RestApiId: !Ref BotApi
            Path: /webhook
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub 'ubbc-bot-${Environment}-*'
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ubbc-bot/${Environment}/*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: 
                - !GetAtt NotificationSender.Arn
                - !GetAtt MessageSender.Arn
        - CloudWatchLogsFullAccess
      Tags:
        Project: UBBCBot
        Environment: !Ref Environment
        Owner: siebrand
        CostCenter: personal
        Application: ubbc-telegram-bot
        ManagedBy: sam

  NotificationSender:
    Type: AWS::Serverless::Function
    DependsOn: NotificationSenderLogGroup
    Properties:
      FunctionName: !Sub 'ubbc-bot-${Environment}-notification-sender'
      CodeUri: src/
      Handler: notification_sender.lambda_handler
      Timeout: 300
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub 'ubbc-bot-${Environment}-*'
        - S3CrudPolicy:
            BucketName: !Ref ImageBucket
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ubbc-bot/${Environment}/*'
        - CloudWatchLogsFullAccess
      Tags:
        Project: UBBCBot
        Environment: !Ref Environment
        Owner: siebrand
        CostCenter: personal
        Application: ubbc-telegram-bot
        ManagedBy: sam

  MessageSender:
    Type: AWS::Serverless::Function
    DependsOn: MessageSenderLogGroup
    Properties:
      FunctionName: !Sub 'ubbc-bot-${Environment}-message-sender'
      CodeUri: src/
      Handler: message_sender.lambda_handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: 
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ubbc-bot/${Environment}/telegram-bot-token'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ubbc-bot/${Environment}/telegram-api-id'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ubbc-bot/${Environment}/telegram-api-hash'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ubbc-bot/${Environment}/telegram-session'
        - CloudWatchLogsFullAccess
      Tags:
        Project: UBBCBot
        Environment: !Ref Environment
        Owner: siebrand
        CostCenter: personal
        Application: ubbc-telegram-bot
        ManagedBy: sam

  # DynamoDB Tables
  CountersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-counters'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: counter_name
          AttributeType: S
      KeySchema:
        - AttributeName: counter_name
          KeyType: HASH
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  OffersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-offers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: offer_id
          AttributeType: N
      KeySchema:
        - AttributeName: offer_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-customers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: telegram_user_id
          AttributeType: N
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: telegram-user-index
          KeySchema:
            - AttributeName: telegram_user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
        - AttributeName: offer_id
          AttributeType: N
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: customer-index
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: offer-index
          KeySchema:
            - AttributeName: offer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  BoxesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-boxes'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: box_id
          AttributeType: S
        - AttributeName: offer_id
          AttributeType: N
      KeySchema:
        - AttributeName: box_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: offer-index
          KeySchema:
            - AttributeName: offer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  SuppliersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-suppliers'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: supplier_id
          AttributeType: S
      KeySchema:
        - AttributeName: supplier_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  DiscountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-discounts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: discount_id
          AttributeType: S
      KeySchema:
        - AttributeName: discount_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-notifications'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: notification_id
          AttributeType: S
        - AttributeName: offer_id
          AttributeType: N
      KeySchema:
        - AttributeName: notification_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: offer-index
          KeySchema:
            - AttributeName: offer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  EditContextsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-edit-contexts'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: context_id
          AttributeType: S
      KeySchema:
        - AttributeName: context_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  OrderHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-order-history'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: history_id
          AttributeType: S
        - AttributeName: order_id
          AttributeType: S
        - AttributeName: changed_at
          AttributeType: S
        - AttributeName: customer_event
          AttributeType: S
        - AttributeName: event_date
          AttributeType: S
        - AttributeName: customer_name_event
          AttributeType: S
      KeySchema:
        - AttributeName: history_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: order-index
          KeySchema:
            - AttributeName: order_id
              KeyType: HASH
            - AttributeName: changed_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: customer-event-index
          KeySchema:
            - AttributeName: customer_event
              KeyType: HASH
            - AttributeName: changed_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: event-date-index
          KeySchema:
            - AttributeName: event_date
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: customer-name-event-index
          KeySchema:
            - AttributeName: customer_name_event
              KeyType: HASH
            - AttributeName: changed_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  CustomerCreditsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-customer-credits'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: customer_id
          KeyType: HASH
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  CreditTransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ubbc-bot-${Environment}-credit-transactions'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transaction_id
          AttributeType: S
        - AttributeName: customer_id
          AttributeType: S
      KeySchema:
        - AttributeName: transaction_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: customer-index
          KeySchema:
            - AttributeName: customer_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

  # S3 Bucket for Images
  ImageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ubbc-bot-${Environment}-${AWS::AccountId}-images'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 3
      Tags:
        - Key: Project
          Value: UBBCBot
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: siebrand
        - Key: CostCenter
          Value: personal
        - Key: Application
          Value: ubbc-telegram-bot
        - Key: ManagedBy
          Value: sam

Outputs:
  WebhookUrl:
    Description: Webhook URL for Telegram bot
    Value: !Sub 'https://${BotApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/webhook'
  
  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref BotApi

  OffersApiUrl:
    Description: Public API URL for active offers
    Value: !Sub 'https://${BotApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/offers'
