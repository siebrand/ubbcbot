name: Static analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, so newly published advisories for pinned dependencies surface
    # even when nobody is pushing.
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mypy:
    name: mypy (type check)
    runs-on: ubuntu-latest
    # Advisory until the existing findings are fixed. Remove this line to make
    # the job blocking. Results still show in the job log.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            src/requirements.txt
            tests/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt -r tests/requirements.txt
      - name: Run mypy
        run: mypy src

  bandit:
    name: bandit (security lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run bandit
        run: |
          pip install bandit==1.9.4
          bandit -r src -c pyproject.toml

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r src/requirements.txt -r tests/requirements.txt --progress-spinner off
