name: Bug report
description: Report something that isn't working correctly
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** include secrets (tokens,
        credentials) or real customer data. For security issues, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command(s) or actions that trigger the problem.
      placeholder: |
        1. Send `/order 37 2`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - test
        - prod
        - unknown
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any relevant CloudWatch log lines (with secrets/PII removed).
      render: text
    validations:
      required: false
