[tool.ruff]
target-version = "py314"
line-length = 120
# Retired code kept only for reference; not maintained to current lint spec.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Changelog entries are long single-line HTML strings sent verbatim to users;
# wrapping them would change the rendered output, so allow long lines here.
"src/handlers/customer/changelog_commands.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
