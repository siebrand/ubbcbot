[tool.ruff]
target-version = "py314"
line-length = 120
# Retired code kept only for reference; not maintained to current lint spec.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Changelog entries are long single-line HTML strings sent verbatim to users;
# wrapping them would change the rendered output, so allow long lines here.
"src/handlers/customer/changelog_commands.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Also check the bodies of functions without annotations: a call to a method that no longer existed survived for
# seven months in one (audit 3, A0).
check_untyped_defs = true
# Retired code kept only for reference (same as ruff).
exclude = ["^archive/", "^venv/", "^test_env/", "^setup_venv/"]

[tool.bandit]
exclude_dirs = ["tests", "archive", "venv", "test_env", "setup_venv"]
# B105: false positive. The string is the name of the Telegram secret-token
#       header, not a secret value.
# B311: random is used to sample cleanup runs in utils/edit_context.py, not for
#       anything security related.
skips = ["B105", "B311"]

# Code coverage: `pytest --cov` (CI does this; plain `pytest` stays fast).
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
# CI fails below this percentage (lines and branches together). It was 62.5 on 2026-11-19: raise it when the
# coverage rises, so it can only go up.
fail_under = 75.5
precision = 1
skip_empty = true
